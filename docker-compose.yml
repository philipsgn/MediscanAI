# ============================================================
# Mediscan AI - Docker Compose (Local Production)
# 1 lệnh chạy toàn bộ hệ thống: docker compose up --build
# ============================================================

name: mediscan-ai

services:
  # ---------- Database: PostgreSQL 16 (Port 5432) ----------
  db:
    image: postgres:16-alpine
    container_name: mediscan-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mediscan_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mediscan-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mediscan_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------- Backend: FastAPI (Port 8000) ----------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mediscan-backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/mediscan_db}
      # Truyền API Keys từ file .env ở root / biến môi trường của host
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Local LLM (for Clinical Assessment) - Ollama hoặc tương tự
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://localhost:11434}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5:0.5b}
      # OpenFDA Drug Database API
      OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
      OPENFDA_BASE_URL: ${OPENFDA_BASE_URL:-https://api.fda.gov/drug}
    env_file:
      - path: backend/.env
        required: false
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mediscan-network
    restart: unless-stopped

  # ---------- Frontend: Next.js (Port 3001) ----------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Browser gọi Backend qua cổng publish 8000 của host.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: mediscan-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      - backend
    networks:
      - mediscan-network
    restart: unless-stopped

# ---------- Volumes & Networks ----------
volumes:
  postgres_data:
    driver: local

networks:
  mediscan-network:
    driver: bridge